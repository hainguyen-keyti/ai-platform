services:
  api:
    build: ./api
    # Reload in place, so an api change needs a restart at worst and never a
    # rebuild. The image still defaults to the plain command for a real deploy.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/db/app.db
      MEDIA_PATH: /data/media
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE in .env}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
    volumes:
      - ./api/src:/app/src
      - ./storage/db:/data/db
      - ./storage/media:/data/media
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    volumes:
      # The whole directory, not single files: replacing a file on the host
      # swaps its inode and a single-file bind mount keeps serving the old one.
      # The anonymous volume keeps the container's own node_modules, which are
      # built for linux, from being shadowed by the host's.
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
