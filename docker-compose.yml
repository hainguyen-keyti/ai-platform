services:
  # The full gate brings up a second copy of this stack as its own project (`-p aip-gate`), on
  # API_PORT and WEB_PORT with its own STORAGE_DIR, so its mock worker and test accounts never touch
  # the real stack's database or its jobs (2026-10-30: a real /v1 request was answered by the gate's
  # mock worker). Unset, everything is the real stack's. The images are named so both share them.
  api:
    build: ./api
    image: ai-platform-api
    # Reload in place, so an api change needs a restart at worst and never a
    # rebuild. The image still defaults to the plain command for a real deploy.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "3000", "--reload"]
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      DB_PATH: /data/db/app.db
      MEDIA_PATH: /data/media
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      INVITE_CODE: ${INVITE_CODE:?set INVITE_CODE in .env}
      WORKER_TOKEN: ${WORKER_TOKEN:?set WORKER_TOKEN in .env}
      # The rest of what api/src/config.py reads, from the shell or .env; each
      # default is config.py's own, so leaving one unset changes nothing.
      TOKEN_TTL_HOURS: ${TOKEN_TTL_HOURS:-24}
      DEFAULT_QUOTA: ${DEFAULT_QUOTA:-500}
      JOB_LEASE_SECONDS: ${JOB_LEASE_SECONDS:-420}
      JOB_MAX_ATTEMPTS: ${JOB_MAX_ATTEMPTS:-3}
      CLOCK_OFFSET_SECONDS: ${CLOCK_OFFSET_SECONDS:-0}
      NO_WORKER_SECONDS: ${NO_WORKER_SECONDS:-180}
      PROVIDER_HOLD_SECONDS: ${PROVIDER_HOLD_SECONDS:-600}
    volumes:
      - ./api/src:/app/src
      - ${STORAGE_DIR:-./storage}/db:/data/db
      - ${STORAGE_DIR:-./storage}/media:/data/media
    restart: unless-stopped

  web:
    build: ./web
    image: ai-platform-web
    ports:
      - "${WEB_PORT:-5173}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    volumes:
      # The whole directory, not single files: replacing a file on the host
      # swaps its inode and a single-file bind mount keeps serving the old one.
      # The anonymous volume keeps the container's own node_modules, which are
      # built for linux, from being shadowed by the host's.
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    restart: unless-stopped
